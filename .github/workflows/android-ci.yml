name: Android CI

# The dev sandbox this project was built in has no KVM/hardware virtualization, so it can
# only run Robolectric (a JVM simulation of the Android framework), never a real emulator.
# GitHub-hosted Ubuntu runners do have KVM, so this workflow's instrumented-test job is the
# closest thing to "verified on a real, running Android system" this project gets without a
# physical device (see docs/DECISIONS.md §3).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push makes older runs pointless; cancel them so the emulator jobs do not pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Promise check - the app never touches the phone's own notifications
        run: |
          if grep -rn "cancelNotification\|cancelAllNotifications\|snoozeNotification" app/src/main; then
            echo "Sende must never remove or snooze the user's own notifications"; exit 1
          fi
      - name: Run JVM + Robolectric unit tests (also renders the UI screenshots)
        run: ./gradlew :app:testSideloadDebugUnitTest :app:compilePlayDebugKotlin -Proborazzi.test.record=true --console=plain
      - name: Sideload manifest must not request INTERNET (privacy promise shown in the app)
        run: |
          ./gradlew :app:processSideloadDebugMainManifest :app:processSideloadReleaseManifest --console=plain
          M=$(find app/build -path '*merged_manifests/sideloadRelease/*' -name AndroidManifest.xml | head -1)
          echo "Checking $M"
          if grep -q "android.permission.INTERNET" "$M"; then echo "INTERNET permission found"; exit 1; fi
          grep -o 'uses-permission android:name="[^"]*"' "$M" | sort -u
      - name: Build debug and release APKs
        run: ./gradlew :app:assembleSideloadDebug :app:assembleSideloadRelease :app:assemblePlayDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testSideloadDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: app/build/shots

  instrumented-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 30, 34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on a real accelerated emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: ./gradlew :app:connectedSideloadDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results-api${{ matrix.api-level }}
          path: app/build/outputs/androidTest-results

  preview-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build minified preview APK
        run: ./gradlew :app:assembleSideloadPreview --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and exercise preview APK on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash .github/scripts/preview-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sende-preview-apk
          path: app/build/outputs/apk/sideload/preview/app-sideload-preview.apk

  # Publishes the newest sideloadable APK under one stable, login-free address that downloads
  # straight from GitHub's CDN:
  #   https://github.com/jannet5/Jn/releases/download/son-surum/Sende.apk
  # Older assets are deleted so there is always exactly one current build (named with its date/time).
  release-apk:
    needs: [unit-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/claude/tekpanel-greenfield-spec-6ngokp'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the minified, shared-key-signed sideload APK
        run: ./gradlew :app:assembleSideloadPreview --console=plain
      - name: Verify the APK before publishing it
        run: |
          APK=app/build/outputs/apk/sideload/preview/app-sideload-preview.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -3
          unzip -p "$APK" AndroidManifest.xml >/dev/null
          ls -l "$APK"
      - name: Publish release asset
        run: |
          APK=app/build/outputs/apk/sideload/preview/app-sideload-preview.apk
          STAMP=$(TZ=Europe/Istanbul date +'%d.%m.%y %H.%M')
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cp "$APK" "Sende.apk"
          cp "$APK" "Sende $STAMP.apk"
          NOTES="Son sürüm: $STAMP (Türkiye saati) · commit ${GITHUB_SHA::7} · SHA-256 $SHA"
          gh release view son-surum >/dev/null 2>&1 || gh release create son-surum --prerelease --title "Sende son sürüm" --notes "$NOTES" --target "$GITHUB_SHA"
          gh release view son-surum --json assets -q '.assets[].name' | while IFS= read -r name; do gh release delete-asset son-surum "$name" -y; done
          gh release upload son-surum "Sende.apk" "Sende $STAMP.apk"
          gh release edit son-surum --notes "$NOTES" --title "Sende son sürüm ($STAMP)"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/son-surum/Sende.apk"
