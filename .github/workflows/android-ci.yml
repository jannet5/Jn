name: Android CI

# The dev sandbox this project was built in has no KVM/hardware virtualization, so it can
# only run Robolectric (a JVM simulation of the Android framework), never a real emulator.
# GitHub-hosted Ubuntu runners do have KVM, so this workflow's instrumented-test job is the
# closest thing to "verified on a real, running Android system" this project gets without a
# physical device (see docs/DECISIONS.md §3).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run JVM + Robolectric unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest

  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on a real accelerated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: app/build/outputs/androidTest-results

  preview-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build minified preview APK
        run: ./gradlew :app:assemblePreview --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and exercise preview APK on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: bash .github/scripts/preview-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tekpanel-preview-apk
          path: app/build/outputs/apk/preview/app-preview.apk
