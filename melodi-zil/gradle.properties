# Gradle JVM bellek ayarı ve UTF-8 kodlaması
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# AndroidX kütüphaneleri kullanılır
android.useAndroidX=true
# R sınıfı yalnızca modülün kendi kaynaklarını içerir (derleme hızı)
android.nonTransitiveRClass=true
# Kotlin resmi kod stili
kotlin.code.style=official
