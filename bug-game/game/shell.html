<title>Böcek Ringi</title>
<meta name="theme-color" content="#141a12">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: telefon dikey; üstte sahne (mekan + karakterler + sisli seyirci), altta arena ve kontroller */
:root{--bg:#141a12;--panel:#1f2a1b;--line:#3a4a31;--fg:#f1f6e8;--muted:#b1bfa4;--leaf:#6fc04a;--leafd:#2f6b1c;--sun:#ffd166;--win:#5ee07a;--lose:#ff6b6b;--draw:#9ec5ff;
--display:'Baloo 2','Trebuchet MS',sans-serif;--body:'Nunito',system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;user-select:none;overscroll-behavior:none}
.screen{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:12px;min-height:100%}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(40px,12vw,64px);color:var(--sun);text-shadow:0 4px 0 #6b3d00}
h2{font-size:28px}
.scene{position:relative;border-radius:16px;overflow:hidden;border:3px solid #000;aspect-ratio:16/10;background:#000;max-width:100%}
.scene-svg{display:block;width:100%;height:100%}
.btn{font:800 19px var(--display);border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--leaf);color:#0f2208;box-shadow:0 5px 0 var(--leafd);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leafd)}
.btn.alt{background:var(--panel);color:var(--fg);box-shadow:0 5px 0 #000;border:2px solid var(--line)}
.btn:disabled{opacity:.45}
button:focus-visible,.slot:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.muted{color:var(--muted);font-size:14px;margin:0}
label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px;color:var(--muted);min-width:0}
input{font:700 17px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg);min-width:0;user-select:text}
#worlds{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.world{flex:0 0 auto;scroll-snap-align:start;border:2px solid #000;border-radius:12px;padding:10px 12px;color:#fff;font:800 15px var(--body);background:linear-gradient(160deg,var(--a),var(--b));text-shadow:0 1px 2px #000;cursor:pointer}
.world span{display:block;font-size:12px;opacity:.85}
.world.on{outline:3px solid var(--sun);outline-offset:2px}
/* hikaye */
.dialog{background:#fffdf5;color:#1b1b1b;border:3px solid #000;border-radius:16px;padding:12px 14px 14px;position:relative;min-height:120px}
.dialog .who{font:800 18px var(--display);color:#7a3d00}
.dialog.m .who{color:#1d5e10}.dialog.n{background:#f0ecdf}.dialog.n .who{color:#555}
.dialog p{margin:4px 0 0;font-size:18px;line-height:1.35;font-weight:700}
.step{position:absolute;right:12px;top:10px;font-size:12px;color:#888}
.talk{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.fan{animation:jump .6s ease-in-out infinite alternate}
@keyframes jump{to{transform:translateY(-14px)}}
.shouts text{animation:shout 1.2s ease-in-out infinite}
.shouts text:nth-child(2){animation-delay:.4s}.shouts text:nth-child(3){animation-delay:.8s}
@keyframes shout{0%,100%{opacity:.2}50%{opacity:1}}
.smoke{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(30px)}}
/* oyun */
#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.ps{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;justify-content:space-between;gap:6px;min-width:0}
.ps span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.ps strong{font:800 20px var(--display);color:var(--sun);font-variant-numeric:tabular-nums}
.ps.on{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun) inset}
.rnd{font:800 15px var(--display);color:var(--muted)}
.arena{position:relative;background:radial-gradient(ellipse at center,#a9845e,#7a5a3c);border:3px solid #000;border-radius:20px;padding:10px 8px;display:flex;flex-direction:column;gap:10px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{position:relative;background:#8a6a4a;border:2px solid #2b1d14;border-radius:12px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;min-width:0}
.slot b{position:absolute;top:2px;left:6px;font-size:12px;color:#ffe9c7}
.bugbox{display:flex;flex-direction:column;align-items:center;min-width:0;width:100%}
.bugbox svg{max-width:100%;height:auto}
.bugbox i{font-style:normal;font-size:10.5px;font-weight:800;text-align:center;line-height:1.1;color:#fff;overflow-wrap:anywhere}
.bugbox em{font:800 34px var(--display);color:#ffe9c7;font-style:normal}
.pick{cursor:pointer;background:#3d5a2c;border-color:#1d3512}
.pick.empty{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{background:#557d3d}}
.locked .slot{cursor:default;animation:none;opacity:.8}
.vs{text-align:center;font:800 14px var(--display);color:#ffe9c7;letter-spacing:.1em;margin:-4px 0}
.leaf{position:absolute;left:-3%;right:-3%;top:-6px;height:132px;pointer-events:none;transform:translateY(-140%) rotate(-8deg);opacity:0;transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.leaf.down{transform:none;opacity:1}
.leaf.up{transform:translateY(-160%) rotate(12deg);opacity:0}
.leaf svg{width:100%;height:100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.5))}
.covered .bugbox{visibility:hidden}
.clash{animation:clash .5s ease-in-out}
@keyframes clash{30%{transform:scale(1.15) rotate(-4deg)}60%{transform:scale(.95) rotate(4deg)}}
.won{background:#1f6b2d;border-color:var(--win)}.lost{background:#6b1f1f;border-color:var(--lose)}.draw{background:#2d4466;border-color:var(--draw)}
.res{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;font:800 11px var(--body);padding:2px 6px;border-radius:8px;background:#000;color:#fff;z-index:2}
#msg{min-height:48px;margin:0;font-weight:800;font-size:17px;text-align:center;text-wrap:balance}
/* modallar */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h3{font:800 20px var(--display);margin:0}
.x{background:none;border:0;color:var(--fg);font-size:28px;cursor:pointer;line-height:1;padding:4px 8px}
#picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow-y:auto}
.pbug{background:#2b3a24;border:2px solid var(--line);border-radius:12px;padding:4px 2px;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:2px;font:800 11px var(--body);cursor:pointer;min-width:0}
.pbug.on{border-color:var(--sun);background:#4a5a1c}
.pbug span{overflow-wrap:anywhere;text-align:center;line-height:1.1}
#picker-info{margin:0;font-size:14px;min-height:40px;color:var(--muted)}#picker-info b{color:var(--sun)}
#guide-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;gap:10px;align-items:center;background:#2b3a24;border-radius:12px;padding:6px 10px}
.gitem div{display:flex;flex-direction:column;min-width:0}.gitem small{color:var(--muted);font-size:12.5px}.gitem small.eq{color:var(--draw)}
.big{font:800 clamp(34px,10vw,48px) var(--display);color:var(--sun);text-align:center;margin:0}
#end-scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#end-scores div{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column}
#end-scores strong{font:800 40px var(--display);font-variant-numeric:tabular-nums}
#end-scores .champ{border-color:var(--sun)}#end-scores .champ strong{color:var(--sun)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{font:800 13px var(--body);background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<section class="screen" id="title">
  <div class="top"><h1>Böcek Ringi</h1><button class="mini" id="mute" aria-pressed="false">Ses: açık</button></div>
  <div class="scene" id="title-scene"></div>
  <p class="muted" id="world-info"></p>
  <div><p class="muted">Dünyanı seç (20 farklı hikâye):</p><div id="worlds"></div></div>
  <div class="row"><label for="p1">1. oyuncu<input id="p1" maxlength="14" autocomplete="off"></label><label for="p2">2. oyuncu<input id="p2" maxlength="14" autocomplete="off"></label></div>
  <button class="btn" id="start">Maceraya başla</button>
  <button class="btn alt" id="guide-btn">Böcek rehberi: kim kimi yener?</button>
</section>

<section class="screen" id="story" hidden>
  <div class="scene" id="story-scene"></div>
  <div class="dialog" id="story-box"><div class="who" id="story-who"></div><p id="story-text"></p><span class="step" id="story-step"></span></div>
  <div class="row"><button class="btn alt" id="story-skip">Hikâyeyi geç</button><button class="btn" id="story-next">Devam</button></div>
</section>

<section class="screen" id="turn" hidden>
  <p class="muted" style="text-align:center;margin-top:20vh">Sıra sende</p>
  <p class="big" id="turn-name"></p>
  <p class="muted" id="turn-sub" style="text-align:center"></p>
  <button class="btn" id="turn-go">Hazırım, böcekleri göster</button>
  <p class="muted" style="text-align:center">Diğer oyuncu ekrana bakmasın!</p>
</section>

<section class="screen" id="play" hidden>
  <div id="hud"></div>
  <div class="scene" id="play-scene" style="aspect-ratio:16/9"></div>
  <div class="arena">
    <div class="slots" id="rival-row"></div>
    <div class="leaf" id="leaf"><svg viewBox="0 0 400 120" preserveAspectRatio="none"><path d="M4 60 Q40 2 200 4 Q360 2 396 56 Q370 118 200 118 Q30 118 4 60 Z" fill="#3a9d23" stroke="#1d5e10" stroke-width="6"/><path d="M6 64 Q200 58 394 50" stroke="#c7f9cc" stroke-width="4" fill="none"/><path d="M80 62 q30 -30 60 -36 M80 62 q30 26 60 32 M170 60 q30 -30 60 -38 M170 60 q30 26 60 34 M260 56 q30 -26 60 -30 M260 56 q30 22 60 26" stroke="#c7f9cc" stroke-width="3" fill="none" opacity=".8"/></svg></div>
    <div class="vs">KARŞISINA KOY</div>
    <div class="slots" id="pick-row"></div>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
  <button class="btn" id="go" hidden>Kapıştır!</button>
  <button class="btn" id="next" hidden>Devam</button>
  <button class="mini" id="guide-btn2" style="align-self:center">Böcek rehberi</button>
</section>

<section class="screen" id="end" hidden>
  <div class="scene" id="end-scene"></div>
  <h2 id="end-title" style="text-align:center;color:var(--sun);font-size:36px"></h2>
  <div id="end-scores"></div>
  <p class="muted" id="end-line" style="text-align:center"></p>
  <p class="muted" id="end-best" style="text-align:center"></p>
  <button class="btn" id="again">Tekrar oyna</button>
  <button class="btn alt" id="home">Dünya değiştir</button>
</section>

<div class="modal" id="picker" hidden><div class="sheet" role="dialog" aria-labelledby="picker-title">
  <header><h3 id="picker-title"></h3><button class="x" id="picker-close" aria-label="Kapat">×</button></header>
  <div id="picker-grid"></div><p id="picker-info"></p><button class="btn" id="picker-ok" disabled>Bu böceği koy</button>
</div></div>
<div class="modal" id="guide" hidden><div class="sheet" role="dialog" aria-labelledby="guide-title">
  <header><h3 id="guide-title">Böcek rehberi</h3><button class="x" id="guide-close" aria-label="Kapat">×</button></header>
  <p class="muted">Her böcek 9 böceği yener. Yenersen 10 puan, berabere 3 puan.</p>
  <div id="guide-list"></div>
</div></div>
