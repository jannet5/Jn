<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>Böcek Ringi</title>
<meta name="theme-color" content="#141a12">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: telefon dikey; üstte sahne (mekan + karakterler + sisli seyirci), altta arena ve kontroller */
:root{--bg:#141a12;--panel:#1f2a1b;--line:#3a4a31;--fg:#f1f6e8;--muted:#b1bfa4;--leaf:#6fc04a;--leafd:#2f6b1c;--sun:#ffd166;--win:#5ee07a;--lose:#ff6b6b;--draw:#9ec5ff;
--display:'Baloo 2','Trebuchet MS',sans-serif;--body:'Nunito',system-ui,sans-serif;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;user-select:none;overscroll-behavior:none}
.screen{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:12px;min-height:100%}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(40px,12vw,64px);color:var(--sun);text-shadow:0 4px 0 #6b3d00}
h2{font-size:28px}
.scene{position:relative;border-radius:16px;overflow:hidden;border:3px solid #000;aspect-ratio:16/10;background:#000;max-width:100%}
.scene-svg{display:block;width:100%;height:100%}
.btn{font:800 19px var(--display);border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--leaf);color:#0f2208;box-shadow:0 5px 0 var(--leafd);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--leafd)}
.btn.alt{background:var(--panel);color:var(--fg);box-shadow:0 5px 0 #000;border:2px solid var(--line)}
.btn:disabled{opacity:.45}
button:focus-visible,.slot:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.muted{color:var(--muted);font-size:14px;margin:0}
label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:14px;color:var(--muted);min-width:0}
input{font:700 17px var(--body);padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--fg);min-width:0;user-select:text}
#worlds{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.world{flex:0 0 auto;scroll-snap-align:start;border:2px solid #000;border-radius:12px;padding:10px 12px;color:#fff;font:800 15px var(--body);background:linear-gradient(160deg,var(--a),var(--b));text-shadow:0 1px 2px #000;cursor:pointer}
.world span{display:block;font-size:12px;opacity:.85}
.world.on{outline:3px solid var(--sun);outline-offset:2px}
/* hikaye */
.dialog{background:#fffdf5;color:#1b1b1b;border:3px solid #000;border-radius:16px;padding:12px 14px 14px;position:relative;min-height:120px}
.dialog .who{font:800 18px var(--display);color:#7a3d00}
.dialog.m .who{color:#1d5e10}.dialog.n{background:#f0ecdf}.dialog.n .who{color:#555}
.dialog p{margin:4px 0 0;font-size:18px;line-height:1.35;font-weight:700}
.step{position:absolute;right:12px;top:10px;font-size:12px;color:#888}
.talk{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-8px)}}
.fan{animation:jump .6s ease-in-out infinite alternate}
@keyframes jump{to{transform:translateY(-14px)}}
.shouts text{animation:shout 1.2s ease-in-out infinite}
.shouts text:nth-child(2){animation-delay:.4s}.shouts text:nth-child(3){animation-delay:.8s}
@keyframes shout{0%,100%{opacity:.2}50%{opacity:1}}
.smoke{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(30px)}}
/* oyun */
#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.ps{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;justify-content:space-between;gap:6px;min-width:0}
.ps span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.ps strong{font:800 20px var(--display);color:var(--sun);font-variant-numeric:tabular-nums}
.ps.on{border-color:var(--sun);box-shadow:0 0 0 2px var(--sun) inset}
.rnd{font:800 15px var(--display);color:var(--muted)}
.arena{position:relative;background:radial-gradient(ellipse at center,#a9845e,#7a5a3c);border:3px solid #000;border-radius:20px;padding:10px 8px;display:flex;flex-direction:column;gap:10px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{position:relative;background:#8a6a4a;border:2px solid #2b1d14;border-radius:12px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;min-width:0}
.slot b{position:absolute;top:2px;left:6px;font-size:12px;color:#ffe9c7}
.bugbox{display:flex;flex-direction:column;align-items:center;min-width:0;width:100%}
.bugbox svg{max-width:100%;height:auto}
.bugbox i{font-style:normal;font-size:10.5px;font-weight:800;text-align:center;line-height:1.1;color:#fff;overflow-wrap:anywhere}
.bugbox em{font:800 34px var(--display);color:#ffe9c7;font-style:normal}
.pick{cursor:pointer;background:#3d5a2c;border-color:#1d3512}
.pick.empty{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{background:#557d3d}}
.locked .slot{cursor:default;animation:none;opacity:.8}
.vs{text-align:center;font:800 14px var(--display);color:#ffe9c7;letter-spacing:.1em;margin:-4px 0}
.leaf{position:absolute;left:-3%;right:-3%;top:-6px;height:132px;pointer-events:none;transform:translateY(-140%) rotate(-8deg);opacity:0;transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.leaf.down{transform:none;opacity:1}
.leaf.up{transform:translateY(-160%) rotate(12deg);opacity:0}
.leaf svg{width:100%;height:100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.5))}
.covered .bugbox{visibility:hidden}
.clash{animation:clash .5s ease-in-out}
@keyframes clash{30%{transform:scale(1.15) rotate(-4deg)}60%{transform:scale(.95) rotate(4deg)}}
.won{background:#1f6b2d;border-color:var(--win)}.lost{background:#6b1f1f;border-color:var(--lose)}.draw{background:#2d4466;border-color:var(--draw)}
.res{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);white-space:nowrap;font:800 11px var(--body);padding:2px 6px;border-radius:8px;background:#000;color:#fff;z-index:2}
#msg{min-height:48px;margin:0;font-weight:800;font-size:17px;text-align:center;text-wrap:balance}
/* modallar */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{background:var(--panel);border:2px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;gap:10px;padding:14px 16px 16px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h3{font:800 20px var(--display);margin:0}
.x{background:none;border:0;color:var(--fg);font-size:28px;cursor:pointer;line-height:1;padding:4px 8px}
#picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow-y:auto}
.pbug{background:#2b3a24;border:2px solid var(--line);border-radius:12px;padding:4px 2px;color:var(--fg);display:flex;flex-direction:column;align-items:center;gap:2px;font:800 11px var(--body);cursor:pointer;min-width:0}
.pbug.on{border-color:var(--sun);background:#4a5a1c}
.pbug span{overflow-wrap:anywhere;text-align:center;line-height:1.1}
#picker-info{margin:0;font-size:14px;min-height:40px;color:var(--muted)}#picker-info b{color:var(--sun)}
#guide-list{overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;gap:10px;align-items:center;background:#2b3a24;border-radius:12px;padding:6px 10px}
.gitem div{display:flex;flex-direction:column;min-width:0}.gitem small{color:var(--muted);font-size:12.5px}.gitem small.eq{color:var(--draw)}
.big{font:800 clamp(34px,10vw,48px) var(--display);color:var(--sun);text-align:center;margin:0}
#end-scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#end-scores div{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column}
#end-scores strong{font:800 40px var(--display);font-variant-numeric:tabular-nums}
#end-scores .champ{border-color:var(--sun)}#end-scores .champ strong{color:var(--sun)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{font:800 13px var(--body);background:var(--panel);color:var(--fg);border:2px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<section class="screen" id="title">
  <div class="top"><h1>Böcek Ringi</h1><button class="mini" id="mute" aria-pressed="false">Ses: açık</button></div>
  <div class="scene" id="title-scene"></div>
  <p class="muted" id="world-info"></p>
  <div><p class="muted">Dünyanı seç (20 farklı hikâye):</p><div id="worlds"></div></div>
  <div class="row"><label for="p1">1. oyuncu<input id="p1" maxlength="14" autocomplete="off"></label><label for="p2">2. oyuncu<input id="p2" maxlength="14" autocomplete="off"></label></div>
  <button class="btn" id="start">Maceraya başla</button>
  <button class="btn alt" id="guide-btn">Böcek rehberi: kim kimi yener?</button>
</section>

<section class="screen" id="story" hidden>
  <div class="scene" id="story-scene"></div>
  <div class="dialog" id="story-box"><div class="who" id="story-who"></div><p id="story-text"></p><span class="step" id="story-step"></span></div>
  <div class="row"><button class="btn alt" id="story-skip">Hikâyeyi geç</button><button class="btn" id="story-next">Devam</button></div>
</section>

<section class="screen" id="turn" hidden>
  <p class="muted" style="text-align:center;margin-top:20vh">Sıra sende</p>
  <p class="big" id="turn-name"></p>
  <p class="muted" id="turn-sub" style="text-align:center"></p>
  <button class="btn" id="turn-go">Hazırım, böcekleri göster</button>
  <p class="muted" style="text-align:center">Diğer oyuncu ekrana bakmasın!</p>
</section>

<section class="screen" id="play" hidden>
  <div id="hud"></div>
  <div class="scene" id="play-scene" style="aspect-ratio:16/9"></div>
  <div class="arena">
    <div class="slots" id="rival-row"></div>
    <div class="leaf" id="leaf"><svg viewBox="0 0 400 120" preserveAspectRatio="none"><path d="M4 60 Q40 2 200 4 Q360 2 396 56 Q370 118 200 118 Q30 118 4 60 Z" fill="#3a9d23" stroke="#1d5e10" stroke-width="6"/><path d="M6 64 Q200 58 394 50" stroke="#c7f9cc" stroke-width="4" fill="none"/><path d="M80 62 q30 -30 60 -36 M80 62 q30 26 60 32 M170 60 q30 -30 60 -38 M170 60 q30 26 60 34 M260 56 q30 -26 60 -30 M260 56 q30 22 60 26" stroke="#c7f9cc" stroke-width="3" fill="none" opacity=".8"/></svg></div>
    <div class="vs">KARŞISINA KOY</div>
    <div class="slots" id="pick-row"></div>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
  <button class="btn" id="go" hidden>Kapıştır!</button>
  <button class="btn" id="next" hidden>Devam</button>
  <button class="mini" id="guide-btn2" style="align-self:center">Böcek rehberi</button>
</section>

<section class="screen" id="end" hidden>
  <div class="scene" id="end-scene"></div>
  <h2 id="end-title" style="text-align:center;color:var(--sun);font-size:36px"></h2>
  <div id="end-scores"></div>
  <p class="muted" id="end-line" style="text-align:center"></p>
  <p class="muted" id="end-best" style="text-align:center"></p>
  <button class="btn" id="again">Tekrar oyna</button>
  <button class="btn alt" id="home">Dünya değiştir</button>
</section>

<div class="modal" id="picker" hidden><div class="sheet" role="dialog" aria-labelledby="picker-title">
  <header><h3 id="picker-title"></h3><button class="x" id="picker-close" aria-label="Kapat">×</button></header>
  <div id="picker-grid"></div><p id="picker-info"></p><button class="btn" id="picker-ok" disabled>Bu böceği koy</button>
</div></div>
<div class="modal" id="guide" hidden><div class="sheet" role="dialog" aria-labelledby="guide-title">
  <header><h3 id="guide-title">Böcek rehberi</h3><button class="x" id="guide-close" aria-label="Kapat">×</button></header>
  <p class="muted">Her böcek 9 böceği yener. Yenersen 10 puan, berabere 3 puan.</p>
  <div id="guide-list"></div>
</div></div>

// ---------- Böcek çizimi ----------
function bug(x, y, s, color, rot = 0, cheer = false) {
  let g = `<g transform="translate(${x},${y}) rotate(${rot}) scale(${s})">`;
  for (let i = -1; i <= 1; i++) {
    g += `<path d="M-6 ${i * 9} L-30 ${i * 14 - 8}" stroke="#111" stroke-width="3"/><path d="M6 ${i * 9} L30 ${i * 14 - 8}" stroke="#111" stroke-width="3"/>`;
  }
  g += `<ellipse cx="0" cy="6" rx="18" ry="24" fill="${color}" stroke="#111" stroke-width="3"/>`;
  g += `<line x1="0" y1="-14" x2="0" y2="28" stroke="#111" stroke-width="2" opacity=".6"/>`;
  g += `<circle cx="0" cy="-22" r="11" fill="#2b2b2b" stroke="#111" stroke-width="3"/>`;
  g += `<circle cx="-4" cy="-24" r="3.5" fill="#fff"/><circle cx="4" cy="-24" r="3.5" fill="#fff"/>`;
  g += `<path d="M-4 -31 Q-14 -50 -20 -48 M4 -31 Q14 -50 20 -48" stroke="#111" stroke-width="2.5" fill="none"/>`;
  if (cheer) g += `<path d="M-30 -10 L-38 -36 M30 -10 L38 -36" stroke="#111" stroke-width="4"/>`;
  return g + '</g>';
}

// ---------- Mekan motifleri ----------
function motif(kind, r, c) {
  let g = '';
  const R = (a, b) => a + r() * (b - a);
  switch (kind) {
    case 'mushrooms':
      for (let i = 0; i < 6; i++) { const x = R(0, W), h = R(180, 380), w = R(140, 260);
        g += `<rect x="${x - 18}" y="${520 - h}" width="36" height="${h}" fill="#e8d8c3" opacity=".9"/><ellipse cx="${x}" cy="${520 - h}" rx="${w / 2}" ry="${w / 4}" fill="${['#c0392b', '#8e44ad', '#e67e22'][i % 3]}" opacity=".85"/>`; }
      for (let i = 0; i < 40; i++) g += `<circle cx="${R(0, W)}" cy="${R(60, 500)}" r="${R(2, 5)}" fill="#fff59d" opacity="${R(.4, 1)}"/>`; break;
    case 'palms':
      g += `<circle cx="1050" cy="130" r="60" fill="#fffbe0"/>`;
      g += `<path d="M0 520 Q300 420 600 500 Q900 420 1280 500 L1280 560 L0 560 Z" fill="#a8844f"/>`;

  'centipede', 'dung', 'stag', 'strider', 'tarantula', 'cicada', 'butterfly', 'mosquito', 'pill', 'giant'];
function outcome(a, b) {
  if (a === b) return 0;
  const d = (b - a + 20) % 20;
  if (d === 10) return 0;
  return d < 10 ? 1 : -1;
}
const beats = a => Array.from({ length: 9 }, (_, k) => (a + 1 + k) % 20);

function bugSVG(i, size = 80, extra = '') {

    case 'butterfly': s = `<path d="M0 0 C-50 -50 -50 20 0 6 Z M0 0 C50 -50 50 20 0 6 Z" fill="${col}" stroke="#111" stroke-width="2.5"/><path d="M0 8 C-36 20 -30 46 0 18 Z M0 8 C36 20 30 46 0 18 Z" fill="#ffd166" stroke="#111" stroke-width="2.5"/><circle cx="-22" cy="-12" r="5" fill="#fff"/><circle cx="22" cy="-12" r="5" fill="#fff"/><rect x="-3" y="-14" width="6" height="40" rx="3" fill="#222"/>` + ant(-16); break;
    case 'mosquito': s = L(-4, 4, -30, 30, 2) + L(4, 4, 30, 30, 2) + L(-4, 0, -32, 6, 2) + L(4, 0, 32, 6, 2) + `<ellipse cx="-14" cy="-6" rx="14" ry="5" fill="#eee" opacity=".8" transform="rotate(-20 -14 -6)"/><ellipse cx="14" cy="-6" rx="14" ry="5" fill="#eee" opacity=".8" transform="rotate(20 14 -6)"/><ellipse cx="0" cy="16" rx="5" ry="18" fill="${col}" stroke="#111" stroke-width="2"/>` + head(-10, 6) + `<path d="M0 -16 L0 -40" stroke="#111" stroke-width="2"/>`; break;
    case 'pill': s = legs(3, 10) + `<ellipse cx="0" cy="6" rx="20" ry="26" fill="${col}" stroke="#111" stroke-width="3"/>${[-8, 0, 8, 16, 24].map(y => `<path d="M-19 ${y} Q0 ${y + 6} 19 ${y}" stroke="#555" stroke-width="2" fill="none"/>`).join('')}` + head(-22, 9) + ant(-30); break;
  }
  return `<svg viewBox="-50 -64 100 116" width="${size}" height="${size * 1.16}" role="img" aria-label="${name}" ${extra}>${s}</svg>`;
}

// ---------- Ses (WebAudio ile sentezlenen tezahürat) ----------
let AC = null, muted = false;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
function tone(f, d = .12, type = 'square', v = .06, when = 0) {
  const a = audio(); if (!a || muted) return; const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d);
}
function hey(times = 2) {
  const a = audio(); if (!a || muted) return;
  for (let n = 0; n < times; n++) {
    const t = a.currentTime + n * .32;
    for (let v = 0; v < 6; v++) { // kalabalık: birkaç ses + gürültü
      const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
      o.type = 'sawtooth'; const base = 180 + Math.random() * 260;
      o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base * 1.35, t + .12);
      f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 1.4;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.035, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
      o.connect(f).connect(g).connect(a.destination); o.start(t + Math.random() * .04); o.stop(t + .25);
    }
    const len = a.sampleRate * .2, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let j = 0; j < len; j++) d[j] = (Math.random() * 2 - 1) * (1 - j / len);
    const src = a.createBufferSource(), g2 = a.createGain(); src.buffer = buf; g2.gain.value = .05; src.connect(g2).connect(a.destination); src.start(t);
  }
}
const sfx = {
  tap: () => tone(660, .06, 'triangle', .05),
  place: () => tone(420, .08, 'square', .04),
  leaf: () => { tone(300, .25, 'sine', .05); tone(200, .3, 'sine', .04, .1); },
  win: () => { tone(523, .1); tone(659, .1, 'square', .06, .1); tone(784, .18, 'square', .06, .2); hey(2); },
  draw: () => tone(440, .2, 'triangle', .05),
  lose: () => { tone(300, .15, 'sawtooth', .05); tone(220, .25, 'sawtooth', .05, .12); },
  tick: () => tone(880, .04, 'square', .03),
};

// ---------- Durum ----------
const $ = s => document.querySelector(s);
const save = (k, v) => { try { localStorage.setItem('br_' + k, JSON.stringify(v)); } catch (e) {} };
const load = (k, d) => { try { const v = localStorage.getItem('br_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const S = { world: load('world', 0), names: load('names', ['Oyuncu 1', 'Oyuncu 2']), rounds: 3, round: 1, turn: 0, scores: [0, 0], hidden: [], picks: [], showTime: 5 };
const W0 = () => CONCEPTS[S.world];
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- Sahne (üst bölüm: mekan, maskot, rakip, sisli seyirci) ----------
function sceneSVG(opts = {}) {
  const c = W0(), r = rnd(4242 + S.world * 13);
  let s = `<svg viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" class="scene-svg"><defs><linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.sky[0]}"/><stop offset="1" stop-color="${c.sky[1]}"/></linearGradient><filter id="fb"><feGaussianBlur stdDeviation="16"/></filter></defs>`;
  s += `<rect width="1280" height="800" fill="url(#gs)"/>` + motif(c.motif, r, c) + `<rect y="540" width="1280" height="260" fill="${c.ground}"/>`;
  // seyirci böcekler sisin içinde
  let smoke = ''; for (let k = 0; k < 16; k++) smoke += `<circle cx="${360 + r() * 560}" cy="${420 + r() * 150}" r="${55 + r() * 55}" fill="#eee" opacity="${.22 + r() * .25}"/>`;
  s += `<g class="smoke" filter="url(#fb)">${smoke}</g><g class="crowd">`;
  for (let k = 0; k < 10; k++) s += `<g class="fan" style="animation-delay:${(k % 5) * .12}s"><g transform="translate(${400 + (k % 5) * 110 + r() * 30},${450 + Math.floor(k / 5) * 70})">${bugSVG((S.world + k * 3) % 20, 70).replace('<svg ', '<svg x="-35" y="-40" ')}</g></g>`;
  s += `</g><g class="smoke2" filter="url(#fb)" opacity=".75">${smoke.slice(0, smoke.length / 2)}</g>`;
  s += `<g class="shouts">${[['HEY!', 470, 400], ['HEY HEY!', 640, 380], ['VUR!', 820, 410]].map(([t, x, y]) => `<text x="${x}" y="${y}" font-size="38" font-weight="900" fill="#fff" stroke="#111" stroke-width="6" paint-order="stroke" text-anchor="middle">${t}</text>`).join('')}</g>`;
  s += `<g class="mascot ${opts.talk === 'm' ? 'talk' : ''}">${character(c.mascot, 190, 560, 1.35, false)}</g>`;
  s += `<g class="rival ${opts.talk === 'r' ? 'talk' : ''}">${character(c.rival, 1090, 580, 1.25, true)}</g>`;
  return s + '</svg>';
}

// ---------- Ekranlar ----------
function show(id) { document.querySelectorAll('.screen').forEach(e => e.hidden = e.id !== id); window.scrollTo(0, 0); }

function renderTitle() {
  $('#worlds').innerHTML = CONCEPTS.map((c, i) => `<button class="world ${i === S.world ? 'on' : ''}" data-w="${i}" style="--a:${c.sky[0]};--b:${c.sky[1]}" aria-pressed="${i === S.world}"><span>${String(i + 1).padStart(2, '0')}</span>${c.title}</button>`).join('');
  $('#title-scene').innerHTML = sceneSVG();
  const c = W0();
  $('#world-info').textContent = `${c.mascot.name} (${c.mascot.who}) · Rakip: ${c.rival.name} · ${c.place}`;
  $('#p1').value = S.names[0]; $('#p2').value = S.names[1];
}

const STORY = () => {
  const c = W0(), m = c.mascot.name, r = c.rival.name;
  return [
    ['n', `${c.place}.`],
    ['n', c.hook],
    ['m', `Burası da neresi böyle? Şu sisin içinden bağırışlar geliyor...`],
    ['r', `Hoş geldin ${m}! Ben ${r}. Burada böcekler kapışır, seyirci de coştu bile!`, 'hey'],
    ['r', `Kural basit: yere 5 böcek koyacağım. İyi bak, çünkü sonra üstlerine yaprağı kapatacağım.`],
    ['r', `Sen de her böceğin karşısına onu yenecek böceği koyacaksın. Yenersen 10 puan, berabere 3 puan.`],
    ['r', c.line],
    ['m', `Hazırım! Hadi bakalım, yaprağın altından ne çıkacak?`, 'hey'],
  ];
};
let storyIdx = 0;
function renderStory() {
  const st = STORY(), [who, text, fx] = st[storyIdx], c = W0();
  $('#story-scene').innerHTML = sceneSVG({ talk: who });
  $('#story-who').textContent = who === 'n' ? 'Anlatıcı' : who === 'm' ? c.mascot.name : c.rival.name;
  $('#story-box').className = 'dialog ' + who;
  $('#story-text').textContent = text;
  $('#story-step').textContent = `${storyIdx + 1}/${st.length}`;
  if (fx === 'hey') hey(3);
}

function slotHTML(i, content, cls = '') { return `<div class="slot ${cls}" data-i="${i}"><b>${i + 1}</b><div class="bugbox">${content}</div></div>`; }

function renderBoard() {
  const c = W0();
  $('#hud').innerHTML = `<div class="ps ${S.turn === 0 ? 'on' : ''}"><span>${esc(S.names[0])}</span><strong>${S.scores[0]}</strong></div><div class="rnd">Tur ${S.round}/${S.rounds}</div><div class="ps ${S.turn === 1 ? 'on' : ''}"><span>${esc(S.names[1])}</span><strong>${S.scores[1]}</strong></div>`;
  $('#play-scene').innerHTML = sceneSVG({ talk: 'r' });
  $('#rival-row').innerHTML = S.hidden.map((b, i) => slotHTML(i, b == null ? '' : bugSVG(b, 54) + `<i>${BUGS[b][0]}</i>`)).join('');
  $('#pick-row').innerHTML = S.picks.map((b, i) => slotHTML(i, b == null ? '<em>+</em>' : bugSVG(b, 54) + `<i>${BUGS[b][0]}</i>`, 'pick ' + (b == null ? 'empty' : 'filled'))).join('');
  $('#leaf').className = 'leaf';
}

async function startTurn() {
  S.hidden = Array(5).fill(null); S.picks = Array(5).fill(null);
  S.showTime = Math.max(2, 6 - S.round); // her tur daha az süre
  $('#turn-name').textContent = S.names[S.turn];
  $('#turn-sub').textContent = `Tur ${S.round}/${S.rounds} · ${W0().rival.name} böcekleri diziyor. ${S.showTime} saniye bakabileceksin.`;
  show('turn');
}

async function runShow() {
  show('play'); renderBoard();
  $('#msg').textContent = `${W0().rival.name}: "İyi bak!"`;
  $('#go').hidden = true; $('#pick-row').classList.add('locked');
  const pool = [...Array(20).keys()].sort(() => Math.random() - .5);
  for (let i = 0; i < 5; i++) { await sleep(320); S.hidden[i] = pool[i]; sfx.place(); renderBoard(); }
  for (let t = S.showTime; t > 0; t--) { $('#msg').textContent = `Ezberle! Yaprak ${t} saniye sonra kapanıyor...`; sfx.tick(); await sleep(1000); }
  $('#leaf').className = 'leaf down'; sfx.leaf(); hey(1);
  await sleep(250); $('#rival-row').classList.add('covered');
  await sleep(700);
  $('#msg').textContent = 'Yaprak kapandı! Her slotun altına, o böceği yenecek böceği koy.';
  $('#pick-row').classList.remove('locked');
}

function openPicker(i) {
  sfx.tap();
  $('#picker-title').textContent = `${i + 1}. slotun karşısına hangi böcek?`;
  $('#picker-grid').innerHTML = BUGS.map((b, k) => `<button class="pbug ${S.picks[i] === k ? 'on' : ''}" data-k="${k}">${bugSVG(k, 44)}<span>${b[0]}</span></button>`).join('');
  $('#picker-info').textContent = 'Bir böceğe dokun: kimleri yendiği burada görünür.';
  $('#picker').dataset.slot = i; $('#picker-ok').disabled = true; $('#picker').hidden = false;
}

async function fight() {
  $('#go').hidden = true; $('#pick-row').classList.add('locked');
  $('#rival-row').classList.remove('covered'); $('#leaf').className = 'leaf up'; sfx.leaf(); hey(2);
  await sleep(800);
  let gained = 0;
  for (let i = 0; i < 5; i++) {
    const a = S.picks[i], b = S.hidden[i], o = outcome(a, b);
    const top = $(`#rival-row .slot[data-i="${i}"]`), bot = $(`#pick-row .slot[data-i="${i}"]`);
    top.classList.add('clash'); bot.classList.add('clash');
    $('#msg').textContent = `${BUGS[a][0]} vs ${BUGS[b][0]}...`;
    await sleep(650);
    const pts = o === 1 ? 10 : o === 0 ? 3 : 0; gained += pts; S.scores[S.turn] += pts;
    bot.classList.add(o === 1 ? 'won' : o === 0 ? 'draw' : 'lost'); top.classList.add(o === -1 ? 'won' : o === 0 ? 'draw' : 'lost');
    bot.insertAdjacentHTML('beforeend', `<span class="res">${o === 1 ? 'KAZANDI +10' : o === 0 ? 'BERABERE +3' : 'YENİLDİ'}</span>`);
    (o === 1 ? sfx.win : o === 0 ? sfx.draw : sfx.lose)();
    $('#hud strong').parentElement; // hud yenile
    $('#hud').querySelectorAll('strong')[S.turn].textContent = S.scores[S.turn];
    await sleep(800);
  }
  $('#msg').textContent = `${S.names[S.turn]} bu turda ${gained} puan aldı!`;
  $('#next').hidden = false;
}

function nextTurn() {
  $('#next').hidden = true;
  if (S.turn === 0) S.turn = 1; else { S.turn = 0; S.round++; }
  if (S.round > S.rounds) return finish();
  startTurn();
}

function finish() {
  const [a, b] = S.scores, c = W0();
  const win = a === b ? -1 : a > b ? 0 : 1;
  $('#end-title').textContent = win < 0 ? 'Berabere!' : `${S.names[win]} kazandı!`;
  $('#end-scores').innerHTML = S.names.map((n, i) => `<div class="${i === win ? 'champ' : ''}"><span>${esc(n)}</span><strong>${S.scores[i]}</strong></div>`).join('');
  $('#end-line').textContent = win < 0 ? `${c.rival.name}: "İkiniz de iyi hatırladınız. Bir el daha?"` : `${c.rival.name}: "Tebrikler ${S.names[win]}! Seyirci senin adını bağırıyor!"`;
  $('#end-scene').innerHTML = sceneSVG({ talk: 'r' });
  show('end'); hey(4);
  const best = load('best', 0); const top = Math.max(a, b); if (top > best) save('best', top);
  $('#end-best').textContent = `En yüksek skor: ${Math.max(best, top)}`;
}

function renderGuide() {
  $('#guide-list').innerHTML = BUGS.map((b, k) => `<div class="gitem">${bugSVG(k, 56)}<div><b>${b[0]}</b><small>Yener: ${beats(k).map(x => BUGS[x][0]).join(', ')}</small><small class="eq">Berabere: ${BUGS[(k + 10) % 20][0]}</small></div></div>`).join('');
}

// ---------- Olaylar ----------
document.addEventListener('click', e => {
  const t = e.target.closest('button, .slot'); if (!t) return;
  if (t.matches('.world')) { S.world = +t.dataset.w; save('world', S.world); sfx.tap(); renderTitle(); return; }
  if (t.id === 'start') { audio(); S.names = [$('#p1').value.trim() || 'Oyuncu 1', $('#p2').value.trim() || 'Oyuncu 2']; save('names', S.names);
    S.round = 1; S.turn = 0; S.scores = [0, 0]; storyIdx = 0; show('story'); renderStory(); return; }
  if (t.id === 'story-next') { sfx.tap(); if (++storyIdx >= STORY().length) startTurn(); else renderStory(); return; }
  if (t.id === 'story-skip') { sfx.tap(); startTurn(); return; }
  if (t.id === 'turn-go') { audio(); runShow(); return; }
  if (t.matches('#pick-row .slot') && !$('#pick-row').classList.contains('locked')) { openPicker(+t.dataset.i); return; }
  if (t.matches('.pbug')) { const k = +t.dataset.k; document.querySelectorAll('.pbug').forEach(x => x.classList.toggle('on', x === t)); sfx.tap();
    $('#picker-info').innerHTML = `<b>${BUGS[k][0]}</b> yener: ${beats(k).map(x => BUGS[x][0]).join(', ')}`; $('#picker-ok').disabled = false; $('#picker-ok').dataset.k = k; return; }
  if (t.id === 'picker-ok') { const i = +$('#picker').dataset.slot; S.picks[i] = +t.dataset.k; $('#picker').hidden = true; sfx.place(); renderPicks(); return; }
  if (t.id === 'picker-close') { $('#picker').hidden = true; return; }
  if (t.id === 'go') { fight(); return; }
  if (t.id === 'next') { nextTurn(); return; }
  if (t.id === 'again') { S.round = 1; S.turn = 0; S.scores = [0, 0]; startTurn(); return; }
  if (t.id === 'home') { show('title'); renderTitle(); return; }
  if (t.id === 'guide-btn' || t.id === 'guide-btn2') { renderGuide(); $('#guide').hidden = false; return; }
  if (t.id === 'guide-close') { $('#guide').hidden = true; return; }
  if (t.id === 'mute') { muted = !muted; t.textContent = muted ? 'Ses: kapalı' : 'Ses: açık'; t.setAttribute('aria-pressed', muted); return; }
});
function renderPicks() {
  $('#pick-row').innerHTML = S.picks.map((b, i) => slotHTML(i, b == null ? '<em>+</em>' : bugSVG(b, 54) + `<i>${BUGS[b][0]}</i>`, 'pick ' + (b == null ? 'empty' : 'filled'))).join('');
  const done = S.picks.every(x => x != null);
  $('#go').hidden = !done;
  $('#msg').textContent = done ? 'Hepsi hazır. Kapıştır!' : `${S.picks.filter(x => x == null).length} slot kaldı. Slota dokun, böcek seç.`;
}

renderTitle(); show('title');

</script>
</body></html>
