<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA Göz</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0f1720">
<style>
:root{--bg:#0f1720;--card:#1a2633;--tx:#e8eef5;--mut:#8fa3b8;--ok:#3ecf8e;--warn:#f5b84b;--bad:#ef6461;--ac:#5aa9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px;max-width:480px;margin:auto}
h1{font-size:20px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px}.k{color:var(--mut);font-size:12px}.v{font-size:24px;font-weight:700}
.score{grid-column:1/3;text-align:center}.score .v{font-size:44px}
.warns{grid-column:1/3;min-height:44px}.w{background:#3a2a1a;color:var(--warn);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.okmsg{color:var(--ok);font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin-top:8px}input[type=range]{width:100%}
.row{display:flex;justify-content:space-between}button{background:var(--ac);color:#06121f;border:0;border-radius:10px;padding:10px 14px;font-weight:700;font-size:15px;min-height:44px}
.rest{grid-column:1/3;text-align:center;background:#12351f;color:var(--ok);font-weight:700;display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px;text-align:left}
</style></head><body>
<h1>👓 AURA Göz Asistanı</h1>
<div class="grid">
  <div class="card score"><div class="k">Göz yorgunluk puanı (0 iyi – 100 kötü)</div><div class="v" id="score">0</div></div>
  <div class="card rest" id="rest">🌿 Dinlenme: uzağa bak (20 sn)</div>
  <div class="card"><div class="k">Cam gücü</div><div class="v"><span id="lens">0</span> D</div></div>
  <div class="card"><div class="k">Karartma</div><div class="v"><span id="tint">0</span>%</div></div>
  <div class="card"><div class="k">Mavi filtre</div><div class="v"><span id="blue">0</span>%</div></div>
  <div class="card"><div class="k">Kırpma / dk</div><div class="v" id="blinkv">0</div></div>
  <div class="card warns" id="warns"></div>
  <div class="card" style="grid-column:1/3">
    <div class="k">Sensör simülasyonu (gerçek gözlükte BLE'den gelir)</div>
    <label>Ekran mesafesi: <b id="dv"></b> cm<input id="dist" type="range" min="15" max="120" value="50"></label>
    <label>Göz kırpma / dk: <b id="bv"></b><input id="blink" type="range" min="0" max="25" value="15"></label>
    <label>Oda ışığı (lux): <b id="rv"></b><input id="room" type="range" min="0" max="800" value="300"></label>
    <label>Ekran ışığı (lux): <b id="sv"></b><input id="scr" type="range" min="0" max="800" value="300"></label>
    <label>Saat: <b id="hv"></b><input id="hour" type="range" min="0" max="23" value="14"></label>
    <label>Ekran titremesi (Hz, 0=yok): <b id="pv"></b><input id="pwm" type="range" min="0" max="2000" step="60" value="0"></label>
    <div class="row" style="margin-top:12px"><button id="skip">20 dk ileri sar</button><button id="reset">Sıfırla</button></div>
  </div>
  <div class="card" style="grid-column:1/3"><div class="k">Günlük rapor</div>
    <table><tr><th>Uyarı</th><th>Kez</th></tr><tbody id="log"></tbody></table></div>
</div>
<script src="aura.js"></script>
<script>
const $=id=>document.getElementById(id);
let t=0, counts={}, prevWarn=new Set();
function sensors(){return{t,distance_m:$('dist').value/100,room_lux:+$('room').value,screen_lux:+$('scr').value,
 blinks_last_min:+$('blink').value,hour:+$('hour').value,pwm_hz:+$('pwm').value}}
function render(){
 const s=sensors(),a=AURA.step(s);
 $('dv').textContent=$('dist').value;$('bv').textContent=$('blink').value;$('rv').textContent=$('room').value;
 $('sv').textContent=$('scr').value;$('hv').textContent=$('hour').value+':00';$('pv').textContent=$('pwm').value;
 $('lens').textContent=a.lens_add_d.toFixed(2);$('tint').textContent=Math.round(a.tint*100);
 $('blue').textContent=Math.round(a.blue_cut*100);$('blinkv').textContent=s.blinks_last_min;
 $('rest').style.display=a.resting?'block':'none';
 const score=Math.min(100,a.warnings.length*25+Math.round(a.tint*30)+(a.lens_add_d>2?15:0));
 $('score').textContent=score;$('score').style.color=score<25?'var(--ok)':score<60?'var(--warn)':'var(--bad)';
 $('warns').innerHTML=a.warnings.length?a.warnings.map(w=>`<div class="w">⚠️ ${w}</div>`).join(''):'<div class="okmsg">✅ Gözün rahat</div>';
 const cur=new Set(a.warnings);
 cur.forEach(w=>{if(!prevWarn.has(w))counts[w]=(counts[w]||0)+1});prevWarn=cur;
 $('log').innerHTML=Object.keys(counts).length?Object.entries(counts).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join(''):'<tr><td colspan=2 style="color:var(--mut)">Henüz uyarı yok</td></tr>';
}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',render));
$('skip').onclick=()=>{t+=1180;render()};
$('reset').onclick=()=>{t=0;counts={};prevWarn=new Set();render()};
setInterval(()=>{t+=1;render()},1000);render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
